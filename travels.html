<style>
  .map-header{
    padding: clamp(2.5rem, 6vw, 4rem) 0 1.5rem;
  }
  .map-back{
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: var(--font-body); font-size: 0.9rem; color: var(--text-muted);
    margin-bottom: 1.4rem; transition: color var(--dur-fast) var(--ease);
  }
  .map-back:hover{ color: var(--accent); }
  .map-back svg{ width: 15px; height: 15px; stroke: currentColor; fill: none; }
  .map-eyebrow{
    font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem;
  }
  .map-title{
    font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em;
    font-size: clamp(1.9rem, 4vw, 2.6rem); color: var(--text);
  }
  .map-sub{ color: var(--text-muted); margin-top: 0.7rem; max-width: 60ch; font-size: 1rem; }
  .map-card{
    margin: 2rem 0 3rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(1rem, 3vw, 2rem);
    overflow: hidden;
  }
  .map-svg-wrap{ width: 100%; }
  .map-svg-wrap svg{ width: 100%; height: auto; display: block; }
  .map-land{ fill: var(--border); stroke: none; }
  html.dark .map-land{ fill: #2A2A2C; }
  .map-sphere{ fill: none; stroke: var(--border); stroke-width: 1; }
  .map-pin{ cursor: pointer; }
  .map-pin circle{
    fill: var(--accent); stroke: var(--surface); stroke-width: 1.4;
    transition: r var(--dur-fast) var(--ease), fill var(--dur-fast) var(--ease);
  }
  .map-pin:hover circle, .map-pin.active circle{ r: 6.5; fill: #FF5B4D; }
  .map-pin-label{
    font-family: var(--font-body); font-size: 9.5px; font-weight: 600;
    fill: var(--text); opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .map-pin:hover .map-pin-label, .map-pin.active .map-pin-label{ opacity: 1; }
  .map-legend{
    display: flex; flex-wrap: wrap; gap: 0.55rem;
    margin-top: 0.5rem;
  }
  .map-legend button{
    font-family: var(--font-body); font-size: 0.82rem;
    padding: 0.42rem 0.85rem; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    cursor: pointer; transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  }
  .map-legend button:hover, .map-legend button.active{
    border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
  }
  .map-count{
    font-family: var(--font-body); font-weight: 600; color: var(--text);
    font-size: 1rem; margin-bottom: 0.9rem;
  }
  .map-count span{ color: var(--accent); }
</style>
</head>

const TXT = {
  en: { back:"Back to portfolio", eyebrow:"Where I've Been", title:"30+ countries, one running list.", sub:"A working map of everywhere I've traveled — tap a pin or a name below to see where it is.", count:n=>`Visited <span>${n}</span> places`, copy:"© 2026 Ai Guan. All rights reserved." },
  zh: { back:"返回作品集", eyebrow:"我去过的地方", title:"30多个国家，还在继续增加。", sub:"一张持续更新的旅行地图 — 点击图钉或下方国家名即可查看位置。", count:n=>`已到访 <span>${n}</span> 个地方`, copy:"© 2026 关艾 版权所有" },
  de: { back:"Zurück zum Portfolio", eyebrow:"Wo ich schon war", title:"30+ Länder, Liste wird laufend ergänzt.", sub:"Eine laufend aktualisierte Karte all meiner Reisen — auf einen Pin oder einen Namen unten tippen, um den Ort zu sehen.", count:n=>`${n} Orte besucht`, copy:"© 2026 Ai Guan. Alle Rechte vorbehalten." }
};

function nameFor(pin, lang){ return pin[lang] || pin.en; }

function render(lang){
  document.documentElement.lang = lang;
  const t = TXT[lang] || TXT.en;
  document.getElementById('backLabel').textContent = t.back;
  document.getElementById('mapEyebrow').textContent = t.eyebrow;
  document.getElementById('mapTitle').textContent = t.title;
  document.getElementById('mapSub').textContent = t.sub;
  document.getElementById('mapCount').innerHTML = t.count(PINS.length);
  document.getElementById('footerCopy').textContent = t.copy;

  const g = document.getElementById('pinsGroup');
  g.innerHTML = PINS.map((p, i) => {
    const name = nameFor(p, lang);
    return `<g class="map-pin" data-i="${i}">
      <circle cx="${p.x}" cy="${p.y}" r="4.2"></circle>
      <text class="map-pin-label" x="${p.x + 8}" y="${p.y + 3}">${name}</text>
      <title>${name}</title>
    </g>`;
  }).join('');

  const legend = document.getElementById('mapLegend');
  legend.innerHTML = PINS.map((p, i) => `<button type="button" data-i="${i}">${nameFor(p, lang)}</button>`).join('');

  document.querySelectorAll('.langswitch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  attachInteractions();
}

function attachInteractions(){
  const pins = document.querySelectorAll('.map-pin');
  const legendBtns = document.querySelectorAll('.map-legend button');

  function activate(i){
    pins.forEach(p => p.classList.toggle('active', p.dataset.i === String(i)));
    legendBtns.forEach(b => b.classList.toggle('active', b.dataset.i === String(i)));
  }

  pins.forEach(p => {
    p.addEventListener('mouseenter', () => activate(p.dataset.i));
    p.addEventListener('click', () => activate(p.dataset.i));
  });
  legendBtns.forEach(b => {
    b.addEventListener('mouseenter', () => activate(b.dataset.i));
    b.addEventListener('click', () => activate(b.dataset.i));
  });
}

document.getElementById('themeToggle').addEventListener('click', ()=>{
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ag-theme', isDark ? 'dark' : 'light');
});

document.querySelectorAll('.langswitch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    localStorage.setItem('ag-lang', btn.dataset.lang);
    render(btn.dataset.lang);
  });
});

const savedLang = localStorage.getItem('ag-lang');
render(TXT[savedLang] ? savedLang : 'en');
</script>
</body>
</html>
